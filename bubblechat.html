<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize bubblechat</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="style_bblchat.css">
</head>
<body class="theme-wa">
<div class="topnav">
  <div class="nav-logo"><img src="Pic/icon7.png" alt="logo"></div>
  <span class="nav-title">AUchive — Bubble Chat Editor</span>
</div>

<div class="layout">
  <!-- ═══ LEFT: PREVIEW ═══ -->
  <div class="preview-panel">
    <div class="chat-header" id="chatHeader">
      <span class="header-back">‹</span>
      <div class="header-avatar" id="previewAvatar">👤</div>
      <div class="header-info">
        <div class="header-name" id="previewName">Contact Name</div>
        <div class="header-status" id="previewStatus">online</div>
      </div>
      <div class="header-icons" id="headerIcons">
        <span id="hic1">📹</span><span id="hic2">📞</span><span id="hic3">⋮</span>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="date-chip"><span>Today</span></div>
    </div>
    <div class="chat-inputbar" id="chatInputbar">
      <button class="ibar-icon">😊</button>
      <button class="ibar-icon">📎</button>
      <input class="ibar-field" id="ibarField" type="text" placeholder="Type a message" disabled>
      <button class="ibar-send" id="ibarSend">
        <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 014 4v6a4 4 0 01-8 0V5a4 4 0 014-4zm-1 17.93V21h2v-2.07A8 8 0 0020 11h-2a6 6 0 01-12 0H4a8 8 0 007 7.93z"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══ RIGHT: EDITOR ═══ -->
  <div class="editor-panel">
    <div class="editor-header"><h2>Bubble Chat Editor</h2></div>
    
    <div class="editor-body">
      <!-- THEME PICKER -->
      <div class="field-group">
        <label class="field-label">Chat Theme</label>
        <div class="theme-picker">
          <div class="theme-card tc-wa active" onclick="setTheme('wa',this)">
            <div class="tcp"><div class="tcp-bub in"></div><div class="tcp-bub out"></div></div>
            <div class="tc-label">WhatsApp</div>
          </div>
          <div class="theme-card tc-im" onclick="setTheme('im',this)">
            <div class="tcp"><div class="tcp-bub in"></div><div class="tcp-bub out"></div></div>
            <div class="tc-label">iMessage</div>
          </div>
        </div>
      </div>

      <div class="sep"></div>

      <div class="field-group">
        <label class="field-label">Contact Name</label>
        <input type="text" id="contactName" placeholder="Enter contact name…"
          oninput="document.getElementById('previewName').textContent=this.value||'Contact Name'">
      </div>

      <div class="field-group">
        <label class="field-label">Profile Photos</label>
        <div class="two-col">
          <div class="field-group">
            <label class="field-label">My Profile</label>
            <input type="file" id="profileUploadme" accept="image/*" onchange="loadAvatar(this,'me')">
          </div>
          <div class="field-group">
            <label class="field-label">Contact Profile</label>
            <input type="file" id="profileUpload" accept="image/*" onchange="loadAvatar(this,'contact')">
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Attachments (optional)</label>
        <div class="two-col">
          <div class="field-group">
            <label class="field-label">Picture in Bubble</label>
            <input type="file" id="imageUpload" accept="image/*">
          </div>
          <div class="field-group">
            <label class="field-label">Chat Background</label>
            <input type="file" id="bgupload" accept="image/*" onchange="loadBg(this)">
          </div>
        </div>
      </div>

      <div class="sep"></div>

      <div class="field-group">
        <label class="field-label">Message Content</label>
        <textarea id="message" placeholder="Type the message here…"></textarea>
      </div>

      <div class="two-col">
        <div class="field-group">
          <label class="field-label">Message Time</label>
          <input type="time" id="time" value="10:30">
        </div>
        <div class="field-group">
          <label class="field-label">Bubble Color</label>
          <input type="color" id="bubbleColor" value="#005c4b">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Position</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="side" value="left" checked> ← Left</label>
          <label class="radio-option"><input type="radio" name="side" value="right"> Right →</label>
        </div>
      </div>

      <div class="sep"></div>
      <div class="btn-row">
        <button class="btn-outline" onclick="addBubble()">+ Add Bubble</button>
        <button class="btn-primary" onclick="clearChat()">🗑 Clear</button>
      </div>
      <button class="btn-save" onclick="saveStory()">SAVE STORY</button>
    </div>
  </div>
</div>

<script>
const avatars={me:null,contact:null};

const THEMES={
  wa:{status:'online',icons:['📹','📞','⋮'],placeholder:'Type a message',
      sendSvg:'<svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 014 4v6a4 4 0 01-8 0V5a4 4 0 014-4zm-1 17.93V21h2v-2.07A8 8 0 0020 11h-2a6 6 0 01-12 0H4a8 8 0 007 7.93z"/></svg>',
      defColor:'#005c4b'},
  ig:{status:'Active now',icons:['📞','🎥','ℹ️'],placeholder:'Message…',
      sendSvg:'<svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>',
      defColor:'#833ab4'},
  im:{status:'iMessage',icons:['📞','🎥','ℹ️'],placeholder:'iMessage',
      sendSvg:'<svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>',
      defColor:'#007aff'},
};

function setTheme(t,card){
  document.body.classList.remove('theme-wa','theme-ig','theme-im');
  document.body.classList.add('theme-'+t);
  document.querySelectorAll('.theme-card').forEach(c=>c.classList.remove('active'));
  card.classList.add('active');
  const cfg=THEMES[t];
  document.getElementById('previewStatus').textContent=cfg.status;
  ['hic1','hic2','hic3'].forEach((id,i)=>document.getElementById(id).textContent=cfg.icons[i]||'');
  document.getElementById('ibarField').placeholder=cfg.placeholder;
  document.getElementById('ibarSend').innerHTML=cfg.sendSvg;
  document.getElementById('bubbleColor').value=cfg.defColor;
}

function loadAvatar(input,who){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{avatars[who]=e.target.result;
    if(who==='contact'){document.getElementById('previewAvatar').innerHTML=`<img src="${e.target.result}" alt="">`;}
  };r.readAsDataURL(f);
}

function loadBg(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{const a=document.getElementById('chatArea');
    a.style.backgroundImage=`url(${e.target.result})`;
    a.style.backgroundSize='cover';a.style.backgroundPosition='center';
  };r.readAsDataURL(f);
}

function formatTime(v){
  if(!v)return'';const[h,m]=v.split(':');
  const hr=parseInt(h),ap=hr>=12?'PM':'AM',h12=hr%12||12;
  return`${h12}:${m} ${ap}`;
}

function addBubble(){
  const msg=document.getElementById('message').value.trim();
  const tv=document.getElementById('time').value;
  const color=document.getElementById('bubbleColor').value;
  const side=document.querySelector('input[name="side"]:checked').value;
  const imgFile=document.getElementById('imageUpload').files[0];
  const ts=formatTime(tv);

  if(!msg&&!imgFile){
    const el=document.getElementById('message');
    el.classList.add('field-input-error');el.focus();
    setTimeout(()=>el.classList.remove('field-input-error'),800);return;
  }

  const row=document.createElement('div');
  row.className=`bubble-row ${side}`;
  const av=document.createElement('div');av.className='row-avatar';
  const avSrc=side==='left'?avatars.contact:avatars.me;
  av.innerHTML=avSrc?`<img src="${avSrc}" alt="">`:(side==='left'?'👤':'🙂');

  if(imgFile){
    const r=new FileReader();
    r.onload=e=>{
      const w=document.createElement('div');w.className='bubble-img-wrap';
      w.innerHTML=`<img src="${e.target.result}"><span class="bubble-time">${ts}</span>`;
      row.appendChild(av);row.appendChild(w);
      document.getElementById('chatArea').appendChild(row);scrollBottom();
    };r.readAsDataURL(imgFile);
    document.getElementById('imageUpload').value='';
  }else{
    const b=document.createElement('div');b.className='bubble';
    b.style.background=color;
    b.innerHTML=`${escHtml(msg)}<div class="bubble-meta"><span class="bubble-time">${ts}</span></div>`;
    row.appendChild(av);row.appendChild(b);
    document.getElementById('chatArea').appendChild(row);scrollBottom();
  }
  document.getElementById('message').value='';
}

function clearChat(){document.getElementById('chatArea').innerHTML='<div class="date-chip"><span>Today</span></div>';}

function saveStory(){
  const btn=document.querySelector('.btn-save');
  btn.textContent='✓ SAVED!';btn.style.background='#06cf9c';
  setTimeout(()=>{btn.textContent='SAVE STORY';btn.style.background='';},2000);
}

function scrollBottom(){const a=document.getElementById('chatArea');a.scrollTop=a.scrollHeight;}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
</script>
</body>
</html>
