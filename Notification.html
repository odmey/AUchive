<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auchive Notifications</title>

    <link rel="stylesheet" href="CSS/notif_style.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bitter:wght@600&family=Lora&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <div class="header">
        <span class="material-icons back-btn" onclick="goBack()">arrow_back</span>

        <div class="logo">
            <img src="Pic/Logo.png" alt="logo" class="logo-img">
            <span class="logo-au">AU</span><span class="logo-chive">chive</span>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="filterNotif('all', this)">All</div>
        <div class="tab" onclick="filterNotif('story', this)">Story</div>
        <div class="tab" onclick="filterNotif('social', this)">Social</div>
    </div>

    <div class="container" id="notifContainer"></div>

    <div class="empty" id="emptyState" style="display:none;">
        <span class="material-icons">notifications_off</span>
        <p>Belum ada notifikasi</p>
    </div>

    <script src="JS/notif.js"></script>
</body>

</html>
