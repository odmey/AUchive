<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
     <link rel="stylesheet" href="CSS/readingpage.css">
     <script src="JS/readingpage.js"></script>
</head>
<body>
    <div class="reading-page">

    <aside class="chapter-sidebar">
      <h2>Chapters</h2>

      <div class="chapter-list">
        <button class="chapter-btn active">Chapter 1 - First Chat</button>
        <button class="chapter-btn">Chapter 2 - Unexpected Call</button>
        <button class="chapter-btn">Chapter 3 - Midnight Confession</button>
        <button class="chapter-btn">Chapter 4 - Seen at 2AM</button>
        <button class="chapter-btn">Chapter 5 - The Last Message</button>
      </div>
    </aside>

    <main class="reading-content">

      <div class="story-header">
        <p>Romance • Drama • University AU</p>
        <h1>UNSEEN</h1>
        <p class="author">by odmey_</p>
      </div>

      <section class="chat-story" id="chatStory">
        <!-- <div id="storyParagraph">

        </div>
        <div id="bubbleContainer">
        </div> -->
        <div class="message left">
          kamu masih di kampus?
          <span class="time">10:23 PM</span>
        </div>

        <div class="message right">
          iya, kenapa?
          <span class="time">10:24 PM</span>
        </div>

        <div class="message left">
          aku nungguin kamu pulang.
          <span class="time">10:25 PM</span>
        </div>

      </section>

      <div class="chapter-actions">
        <button class="like-btn">❤️ Like Chapter</button>
      </div>

      <section class="comments-section">
        <h2>Comments</h2>

        <div class="comment-box">
          <textarea placeholder="Write your thoughts about this chapter..."></textarea>
          <button class="post-btn">Post Comment</button>
        </div>

        <div class="comment-item">
          <div class="comment-user">@nayla_</div>
          <p>STOPPP chapter ini bikin aku nangis 😭</p>
        </div>

        <div class="comment-item">
          <div class="comment-user">@jenoverse</div>
          <p>Please author jangan kasih sad ending please</p>
        </div>

      </section>
    </main>
  </div>
</body>
</html>
