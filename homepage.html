<!DOCTYPE html>
<html>
<head>
    <title>AUchive</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            font-family: Georgia,serif;
        }
        .header-wrapper {
            background-color: rgb(255, 244, 79);
            border-radius: 0 0 20px 20px;
        }
        .banner {
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .banner h1 {
            font-size: 90px;
            color: black;
            margin: 0;
        }
        .white-banner {
            background-color: white;
            height: 80px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
        }
        .search-bar {
            width: 700px;
            height: 50px;
            background-color: rgb(255, 244, 79);
            border-radius: 50px;
        }
        .gradasi {
            width: 90%;
            height: 300px;
            margin: 50px auto;
            background: linear-gradient(to bottom, rgb(255, 244, 79), white);
        }
        .cards-wrapper {
            width: 85%;
            margin: 50px auto 80px auto; 
            display: flex;
            justify-content: center;
            gap: 50px; 
        }
        .card-box {
            width: 260px;
            height: 150px;
            background-color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="header-wrapper">
        <div class="banner">
            <h1>AUchive</h1>
        </div>
        <div class="white-banner">
            <div class="search-bar"></div>
        </div>
    </div>
    <div class="gradasi"></div>
    <div class="cards-wrapper">
    <div class="card-box"></div>
    <div class="card-box"></div>
    <div class="card-box"></div>
</div>
</body>
</html>
