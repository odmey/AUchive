<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins&display=swap" rel="stylesheet">
    <title>Homepage</title>
    <style>
        body {
            background-color: white;
            margin: 0;
            font-family: Bitter,Lora,Poppins;
        }
        .header-wrapper {
            background-color: rgb(28,28,28);
            border-radius: 0 0 20px 20px;
        }
        .banner {
            height: 100px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .banner h2 {
            font-size: 60px;
            color: white;
            margin: 0;
            font-family: Bitter;
        }
        .banner h2 span{
            color: rgb(255, 244, 79);
            font-family: Bitter;
        }
        .white-banner {
            background-color: white;
            height: 80px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
        }
        .search-bar {
            width: 700px;
            height: 50px;
            background-color: rgb(255, 244, 79);
            border-radius: 50px;
        }
        .gradasi {
            width: 90%;
            height: 300px;
            margin: 50px auto;
            background: linear-gradient(to bottom, rgb(255, 244, 79), white);
        }
        .cards-wrapper {
            width: 85%;
            margin: 50px auto 80px auto; 
            display: flex;
            justify-content: center;
            gap: 50px; 
        }
        .card-box {
            width: 260px;
            height: 150px;
            background-color: rgb(255, 244, 79);
        }
    </style>
</head>

<body>
    <div class="header-wrapper">
        <div class="banner">
            <h2><span>AU</span>chive</h2>
        </div>
        <div class="white-banner">
            <div class="search-bar"></div>
        </div>
    </div>
    <div class="gradasi"></div>
    <div class="cards-wrapper">
    <div class="card-box"></div>
    <div class="card-box"></div>
    <div class="card-box"></div>
</div>
</body>
</html>
