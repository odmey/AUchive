<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter&family=Lora&family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="CSS/style_setting.css">
    <title>Setting</title>
</head>
<body>
    <header>
        <div class="left">
            <a href="#" class="back-link">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
        </div>
    </header>
    <div class="plain">
        <!-- settings header -->
        <div class="profile-card">
            <img src="Pic/profileicon.jpg" alt="profileicon">
            <div class="profile-desc">
                <h3>Esya SYantics-</h3>
                <p>esya@gmail.com</p>
            </div>
        </div>
        <div class="section-settings">
            <h4>Account</h4>
            <div class="item-set">
                <span>Email</span>
            </div>
            <div class="item-set">
                <span>Password & Security</span>
            </div>
            <div class="item-set">
                <span>Notifications</span>
            </div>
        </div>
        <div class="section-settings">
            <h4>Help Center</h4>
            <div class="item-set">
                <span>FAQ</span>
            </div>
            <div class="item-set">
                <span>Contact Us</span>
            </div>
        </div>
        <div class="section-settings">
            <div class="item-set">
                <span>Log Out</span>
            </div>
        </div>
    </div>
    <footer>
         AUchive Originals | ©2026
    </footer>
</body>
</html>
