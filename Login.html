<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="CSS/style_login.css">
</head>

<body>
    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">

        <div class="signup">
            <form>
                <label for="chk" aria-hidden="true">
                    Sign Up
                    <img src="Pic/icon7.png" class="label-icon" alt="iconlogo">
                </label>
                <div>
                    <span class="icon">
                        <ion-icon name="person-outline"></ion-icon>
                    </span>
                    <input type="text" name="txt" placeholder="Username" required="">
                </div>
                <div>
                    <span class="icon">
                        <ion-icon name="mail-outline"></ion-icon>
                    </span>
                    <input type="email" name="email" placeholder="Email" required="">
                </div>
                <div>
                    <span class="icon">
                        <ion-icon name="key-outline"></ion-icon>
                    </span>
                    <input type="password" name="password" placeholder="Password" required="">
                </div>
                <button>Sign Up</button>
            </form>
        </div>

        <div class="login">
            <form>
                <label for="chk" aria-hidden="true">Login</label>
                <div>
                    <span class="icon">
                        <ion-icon name="mail-outline"></ion-icon>
                    </span>
                    <input type="email" name="email" placeholder="Email" required="">
                </div>
                <div>
                    <span class="icon">
                        <ion-icon name="key-outline"></ion-icon>
                    </span>
                    <input type="password" name="password" placeholder="Password" required="">
                </div>
                <button>Login</button>
            </form>
        </div>

    </div>
</body>
<script></script>

</html>
